<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="920" height="470" fill="#FAFAF7"/>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2B2B28"/>
    </marker>
    <marker id="a2L" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
      <path d="M9,0 L0,4.5 L9,9 z" fill="#2B2B28"/>
    </marker>
  </defs>

  <text x="34" y="40" font-size="20" font-weight="700" fill="#2B2B28">Why the ToF read the floor, and what fixed it</text>
  <text x="34" y="63" font-size="13.5" fill="#6B6B63">Side view. The sensor sees a cone, not a dot. With any nose-down rake the bottom of that cone lands on bright white vinyl.</text>

  <!-- ================= BEFORE ================= -->
  <text x="46" y="102" font-size="13.5" font-weight="700" fill="#B4452F">BEFORE — bare sensor, 25° cone, 1.1° nose-down rake</text>
  <line x1="46" y1="228" x2="880" y2="228" stroke="#C9C9C0" stroke-width="2"/>
  <rect x="46" y="228" width="834" height="18" fill="#FFFFFF" stroke="#E3E3DC"/>
  <text x="52" y="260" font-size="11.5" fill="#6B6B63">white vinyl mat — high reflectance</text>

  <!-- car nose -->
  <path d="M56,178 L150,178 L156,208 L56,208 Z" fill="#2B2B28"/>
  <rect x="148" y="186" width="14" height="12" rx="2" fill="#B4452F"/>
  <text x="60" y="172" font-size="11.5" font-weight="600" fill="#6B6B63">car</text>

  <!-- cone hitting floor -->
  <path d="M162,192 L360,228 L360,150 Z" fill="#E9B7A8" opacity="0.55"/>
  <line x1="162" y1="192" x2="360" y2="228" stroke="#B4452F" stroke-width="1.6"/>
  <line x1="162" y1="192" x2="880" y2="62" stroke="#B4452F" stroke-width="1.6" stroke-dasharray="5 5"/>
  <circle cx="360" cy="228" r="6" fill="#B4452F"/>
  <line x1="162" y1="272" x2="360" y2="272" stroke="#2B2B28" stroke-width="1.4" marker-start="url(#a2L)" marker-end="url(#a2)"/>
  <text x="261" y="290" font-size="13" font-weight="700" fill="#B4452F" text-anchor="middle">166 mm</text>
  <text x="261" y="306" font-size="11.5" fill="#6B6B63" text-anchor="middle">first ground return — reported as a wall</text>

  <!-- real wall -->
  <rect x="700" y="128" width="16" height="100" fill="#3A3A35"/>
  <text x="666" y="120" font-size="11.5" font-weight="600" fill="#6B6B63">real wall, matte black</text>
  <text x="666" y="136" font-size="11.5" fill="#6B6B63">442.5 mm — weak return, loses</text>

  <!-- ================= AFTER ================= -->
  <text x="46" y="350" font-size="13.5" font-weight="700" fill="#2F7D4F">AFTER — 2.5 × 10 × 20 mm printed collimator + 2.0° upward wedge</text>
  <line x1="46" y1="424" x2="880" y2="424" stroke="#C9C9C0" stroke-width="2"/>
  <rect x="46" y="424" width="834" height="18" fill="#FFFFFF" stroke="#E3E3DC"/>

  <path d="M56,384 L150,384 L156,412 L56,412 Z" fill="#2B2B28"/>
  <rect x="148" y="390" width="22" height="12" rx="2" fill="#2F7D4F"/>
  <text x="174" y="386" font-size="11" font-weight="600" fill="#2F7D4F">collimator</text>

  <path d="M170,396 L806,424 L806,350 Z" fill="#BFDCC8" opacity="0.55"/>
  <line x1="170" y1="396" x2="806" y2="424" stroke="#2F7D4F" stroke-width="1.6"/>
  <circle cx="806" cy="424" r="6" fill="#2F7D4F"/>
  <line x1="170" y1="452" x2="806" y2="452" stroke="#2B2B28" stroke-width="1.4" marker-start="url(#a2L)" marker-end="url(#a2)"/>
  <text x="488" y="468" font-size="13" font-weight="700" fill="#2F7D4F" text-anchor="middle">870 mm — first ground return pushed well past the wall</text>

  <rect x="600" y="330" width="16" height="94" fill="#3A3A35"/>
  <text x="560" y="322" font-size="11.5" font-weight="600" fill="#2F7D4F">wall at 442.5 mm now wins</text>

  <rect x="640" y="254" width="240" height="52" rx="6" fill="#F2F2EC" stroke="#E3E3DC"/>
  <text x="652" y="273" font-size="11.5" font-weight="700" fill="#2B2B28">Signal rate, not distance, separates them</text>
  <text x="652" y="290" font-size="11.5" fill="#6B6B63">floor return is STRONG, wall return is WEAK</text>
</svg>
