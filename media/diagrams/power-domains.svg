<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="920" height="430" fill="#FAFAF7"/>
  <defs><marker id="p1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#57574F"/></marker></defs>
  <text x="34" y="40" font-size="20" font-weight="700" fill="#2B2B28">Four isolated power domains, one star ground</text>
  <text x="34" y="63" font-size="13.5" fill="#6B6B63">The servo stall spike must never reach the MCU rail. That is the whole reason this is four regulators and not one.</text>

  <rect x="40" y="150" width="120" height="72" rx="8" fill="#2B2B28"/>
  <text x="100" y="182" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">LiPo pack</text>
  <text x="100" y="201" font-size="11.5" fill="#B9B9B0" text-anchor="middle">3S</text>

  <rect x="182" y="162" width="74" height="48" rx="6" fill="#F2F2EC" stroke="#57574F" stroke-width="1.6"/>
  <text x="219" y="184" font-size="11.5" font-weight="700" fill="#2B2B28" text-anchor="middle">MASTER</text>
  <text x="219" y="199" font-size="11.5" fill="#6B6B63" text-anchor="middle">switch</text>
  <line x1="160" y1="186" x2="180" y2="186" stroke="#57574F" stroke-width="2" marker-end="url(#p1)"/>

  <!-- motor rail bypasses the switch -->
  <path d="M100,150 L100,86 L640,86" fill="none" stroke="#B4452F" stroke-width="2.4" marker-end="url(#p1)"/>
  <rect x="648" y="62" width="230" height="50" rx="8" fill="#F7E9E4" stroke="#B4452F" stroke-width="1.6"/>
  <text x="662" y="82" font-size="12.5" font-weight="700" fill="#B4452F">1. MOTOR RAIL — unregulated</text>
  <text x="662" y="99" font-size="11.5" fill="#8A5A4C">BTS7960 → 25GA motor. B+/B− straight from the pack, never on the carrier.</text>

  <!-- three bucks -->
  <g>
    <rect x="300" y="140" width="96" height="44" rx="6" fill="#F2F2EC" stroke="#57574F"/>
    <text x="348" y="160" font-size="12" font-weight="700" fill="#2B2B28" text-anchor="middle">BUCK 6.0 V</text>
    <text x="348" y="175" font-size="11" fill="#6B6B63" text-anchor="middle">3 A</text>
    <line x1="256" y1="186" x2="296" y2="164" stroke="#57574F" stroke-width="2" marker-end="url(#p1)"/>
    <rect x="424" y="132" width="454" height="50" rx="8" fill="#FDF3E3" stroke="#D08B2E" stroke-width="1.6"/>
    <text x="438" y="152" font-size="12.5" font-weight="700" fill="#9A6413">2. SERVO RAIL</text>
    <text x="438" y="169" font-size="11.5" fill="#8A6B3A">JX PS-1171MG. Its own regulator so the stall spike cannot brown out the MCU.</text>
    <line x1="396" y1="160" x2="420" y2="158" stroke="#57574F" stroke-width="2" marker-end="url(#p1)"/>
  </g>

  <g>
    <rect x="300" y="204" width="96" height="44" rx="6" fill="#F2F2EC" stroke="#57574F"/>
    <text x="348" y="224" font-size="12" font-weight="700" fill="#2B2B28" text-anchor="middle">BUCK 5.0 V</text>
    <text x="348" y="239" font-size="11" fill="#6B6B63" text-anchor="middle">2 A</text>
    <line x1="256" y1="190" x2="296" y2="222" stroke="#57574F" stroke-width="2" marker-end="url(#p1)"/>
    <rect x="424" y="196" width="454" height="62" rx="8" fill="#EDF2FB" stroke="#3B7DD8" stroke-width="1.6"/>
    <text x="438" y="216" font-size="12.5" font-weight="700" fill="#2A5DA6">3. LOGIC RAIL</text>
    <text x="438" y="233" font-size="11.5" fill="#41628F">BlackPill STM32F411 → onboard AMS1117 3.3 V → TCA9548A, 2× VL53L1X, TCS34725, BNO085.</text>
    <text x="438" y="249" font-size="11.5" fill="#41628F">Measured draw ≈ 170 mA against a 2 A budget — 8× margin.</text>
    <line x1="396" y1="224" x2="420" y2="224" stroke="#57574F" stroke-width="2" marker-end="url(#p1)"/>
  </g>

  <g>
    <rect x="300" y="270" width="96" height="44" rx="6" fill="#F2F2EC" stroke="#57574F"/>
    <text x="348" y="290" font-size="12" font-weight="700" fill="#2B2B28" text-anchor="middle">BUCK 5.0 V</text>
    <text x="348" y="305" font-size="11" fill="#6B6B63" text-anchor="middle">5–8 A</text>
    <line x1="256" y1="196" x2="296" y2="286" stroke="#57574F" stroke-width="2" marker-end="url(#p1)"/>
    <rect x="424" y="272" width="454" height="50" rx="8" fill="#F0EDF8" stroke="#6B4FA8" stroke-width="1.6"/>
    <text x="438" y="292" font-size="12.5" font-weight="700" fill="#513B80">4. SBC RAIL</text>
    <text x="438" y="309" font-size="11.5" fill="#6A5A94">Raspberry Pi 5 (8 GB) + RPLIDAR C1. Physically disconnected for the Open round.</text>
    <line x1="396" y1="292" x2="420" y2="294" stroke="#57574F" stroke-width="2" marker-end="url(#p1)"/>
  </g>

  <!-- star ground -->
  <circle cx="219" cy="360" r="15" fill="#2B2B28"/>
  <text x="219" y="365" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">★</text>
  <text x="244" y="356" font-size="12.5" font-weight="700" fill="#2B2B28">SINGLE STAR GROUND</text>
  <text x="244" y="372" font-size="11.5" fill="#6B6B63">every return meets at exactly one point — no ground loops, no shared return impedance</text>
  <path d="M348,184 L348,340 L234,352" fill="none" stroke="#9A9A90" stroke-width="1.3" stroke-dasharray="4 4"/>
  <path d="M348,248 L348,340" fill="none" stroke="#9A9A90" stroke-width="1.3" stroke-dasharray="4 4"/>
  <path d="M348,314 L348,340" fill="none" stroke="#9A9A90" stroke-width="1.3" stroke-dasharray="4 4"/>
  <path d="M760,112 L760,392 L234,368" fill="none" stroke="#9A9A90" stroke-width="1.3" stroke-dasharray="4 4"/>

  <text x="34" y="416" font-size="11.5" fill="#8A8A82">Wiring standard: crimped latched JST-XH throughout, ferruled screw terminals on high current. No DuPont jumpers and no breadboard anywhere on the vehicle.</text>
</svg>
