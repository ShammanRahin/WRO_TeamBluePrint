<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect width="920" height="520" fill="#FAFAF7"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2B2B28"/>
    </marker>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
      <path d="M9,0 L0,4.5 L9,9 z" fill="#2B2B28"/>
    </marker>
  </defs>

  <text x="34" y="42" font-size="20" font-weight="700" fill="#2B2B28">Lane-gap lateral correction</text>
  <text x="34" y="65" font-size="13.5" fill="#6B6B63">The corner lines are radial, so the distance between them is a ruler for how far out you are running.</text>

  <!-- walls -->
  <rect x="60" y="96" width="800" height="22" fill="#3A3A35"/>
  <text x="70" y="90" font-size="12.5" font-weight="600" fill="#6B6B63">OUTER WALL</text>
  <rect x="60" y="406" width="800" height="22" fill="#3A3A35"/>
  <text x="70" y="449" font-size="12.5" font-weight="600" fill="#6B6B63">INNER WALL</text>

  <!-- mat -->
  <rect x="60" y="118" width="800" height="288" fill="#FFFFFF" stroke="#E3E3DC"/>

  <!-- radial corner lines: converge below the inner wall -->
  <line x1="349.3" y1="118" x2="285" y2="406" stroke="#E07B39" stroke-width="9" stroke-linecap="round"/>
  <line x1="532.7" y1="118" x2="405" y2="406" stroke="#3B7DD8" stroke-width="9" stroke-linecap="round"/>
  <text x="300" y="138" font-size="12.5" font-weight="700" fill="#E07B39">ORANGE</text>
  <text x="545" y="138" font-size="12.5" font-weight="700" fill="#3B7DD8">BLUE</text>

  <!-- reference pass, corner 1 -->
  <line x1="60" y1="205" x2="860" y2="205" stroke="#9A9A90" stroke-width="1.6" stroke-dasharray="7 6"/>
  <circle cx="329.9" cy="205" r="5.5" fill="#E07B39"/>
  <circle cx="497.2" cy="205" r="5.5" fill="#3B7DD8"/>
  <rect x="96" y="191" width="46" height="28" rx="5" fill="#2B2B28"/>
  <circle cx="107" cy="221" r="5" fill="#57574F"/><circle cx="132" cy="221" r="5" fill="#57574F"/>
  <text x="152" y="199" font-size="12.5" font-weight="700" fill="#2B2B28">CORNER 1</text>
  <text x="152" y="215" font-size="11.5" fill="#6B6B63">sets the reference</text>

  <line x1="329.9" y1="176" x2="497.2" y2="176" stroke="#2B2B28" stroke-width="1.5" marker-start="url(#arL)" marker-end="url(#ar)"/>
  <rect x="368" y="156" width="92" height="20" rx="4" fill="#FAFAF7"/>
  <text x="414" y="171" font-size="13" font-weight="700" fill="#2B2B28" text-anchor="middle">gap_ref</text>

  <!-- drifted pass -->
  <line x1="60" y1="340" x2="860" y2="340" stroke="#9A9A90" stroke-width="1.6" stroke-dasharray="7 6"/>
  <circle cx="299.7" cy="340" r="5.5" fill="#E07B39"/>
  <circle cx="426.2" cy="340" r="5.5" fill="#3B7DD8"/>
  <rect x="96" y="326" width="46" height="28" rx="5" fill="#B4452F"/>
  <circle cx="107" cy="356" r="5" fill="#57574F"/><circle cx="132" cy="356" r="5" fill="#57574F"/>
  <text x="152" y="334" font-size="12.5" font-weight="700" fill="#B4452F">A LATER CORNER</text>
  <text x="152" y="350" font-size="11.5" fill="#6B6B63">car has drifted toward the inner wall</text>

  <line x1="299.7" y1="372" x2="426.2" y2="372" stroke="#B4452F" stroke-width="1.5" marker-start="url(#arL)" marker-end="url(#ar)"/>
  <rect x="322" y="374" width="82" height="20" rx="4" fill="#FAFAF7"/>
  <text x="363" y="389" font-size="13" font-weight="700" fill="#B4452F" text-anchor="middle">gap &lt; gap_ref</text>

  <!-- correction arrow -->
  <line x1="700" y1="336" x2="700" y2="222" stroke="#2F7D4F" stroke-width="2.4" marker-end="url(#ar)"/>
  <rect x="716" y="258" width="150" height="44" rx="6" fill="#EAF3EC" stroke="#2F7D4F"/>
  <text x="726" y="276" font-size="12.5" font-weight="700" fill="#2F7D4F">correction</text>
  <text x="726" y="292" font-size="11.5" fill="#2F7D4F">steer back out, 25 cm</text>

  <!-- maths -->
  <rect x="60" y="466" width="800" height="34" rx="6" fill="#F2F2EC" stroke="#E3E3DC"/>
  <text x="76" y="488" font-size="13" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" fill="#2B2B28">gap_error = measured_gap − gap_ref      offset_deg = clamp(K_LAT_DEG_PER_CM × gap_error, ±MAX_LAT_OFFSET_DEG)      K = 4, cap 30°</text>
</svg>
